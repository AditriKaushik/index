services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_dev_password
      POSTGRES_DB: social_platform
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d social_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://app:app_dev_password@db:5432/social_platform?schema=public"
      JWT_ACCESS_SECRET: "dev-access-secret-change-me"
      JWT_REFRESH_SECRET: "dev-refresh-secret-change-me"
      WEBAUTHN_RP_ID: "localhost"
      WEBAUTHN_RP_NAME: "Social Platform"
      WEBAUTHN_ORIGIN: "http://localhost:3000"
      OTP_PROVIDER: "console"

volumes:
  db-data:
