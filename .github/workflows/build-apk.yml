name: Build Live Share APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'liveshare/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'liveshare/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write   # to attach the APKs to the apk-latest release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The APK bundles its own copy of liveshare/, so a stale copy would ship an
      # app that disagrees with the website. The Gradle build copies it in; this
      # just proves the source (page + vendored QR libs) is there before we start.
      - name: Check the web app is present
        run: |
          test -f liveshare/index.html
          test -f liveshare/vendor/qrcode.min.js
          test -f liveshare/vendor/jsQR.min.js

      # Optional. With no keystore secret the release APK is signed with the
      # debug key instead, which still installs - it just cannot be updated by a
      # later properly-signed build.
      - name: Decode the signing keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/liveshare.jks"
            echo "path=$RUNNER_TEMP/liveshare.jks" >> "$GITHUB_OUTPUT"
            echo "Release APK will be signed with the supplied key."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret set - signing the release APK with the debug key."
          fi

      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=1.0.${{ github.run_number }} \
            assembleDebug assembleRelease

      - name: Name the outputs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/liveshare-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk dist/liveshare-release.apk
          echo "Built:"
          ls -lh dist
          sha256sum dist/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: liveshare-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      # A release asset is a plain link Android hands straight to the installer,
      # and this tag always points at the newest build, so the link never changes.
      # Restricted to this repository's own branches: a fork's pull request must
      # not be able to publish something people are told to install.
      - name: Publish the rolling APK release
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: apk-latest
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo "Live Share for Android, built from \`$COMMIT\` by [run $GITHUB_RUN_NUMBER](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo
            echo "### [Download liveshare-release.apk](https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/liveshare-release.apk)"
            echo
            echo "Open that link on the phone and Android offers to install it. The first time, you have to allow installing apps from your browser."
            echo
            echo "Signed with the debug key unless repository signing secrets are set: it installs, but a later properly-signed build cannot upgrade over it."
            echo
            echo "This tag always points at the most recent build, so the link never changes."
          } > "$RUNNER_TEMP/notes.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --prerelease
          else
            gh release create "$TAG" \
              --prerelease \
              --target "$COMMIT" \
              --title "Live Share APK (latest build)" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi

          gh release upload "$TAG" dist/liveshare-debug.apk dist/liveshare-release.apk --clobber

          echo "Direct download: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/liveshare-release.apk"
