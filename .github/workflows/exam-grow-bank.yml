name: MockPariksha – add AI questions

# Run from the Actions tab: pick an exam and how many questions to add.
# Needs the repository secret ANTHROPIC_API_KEY. Opens a pull request with
# the new questions; nothing reaches students until that PR is merged.
on:
  workflow_dispatch:
    inputs:
      exam:
        description: 'Exam id (file name in exam/data/exams, e.g. ssc-cgl), or "all"'
        required: true
      count:
        description: 'Questions to add per exam'
        required: true
        default: '30'

permissions:
  contents: write
  pull-requests: write

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: exam/tools
      - name: Generate, independently review and keep questions with PYQ relevance ≥ 90
        working-directory: exam/tools
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EXAM: ${{ inputs.exam }}
          COUNT: ${{ inputs.count }}
        run: |
          if [ "$EXAM" = all ]; then ids=$(ls ../data/exams | sed 's/\.json$//'); else ids="$EXAM"; fi
          for id in $ids; do node grow-bank.mjs "$id" "$COUNT"; done
      - run: node exam/data/validate.mjs && node exam/data/build-catalog.mjs
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          EXAM: ${{ inputs.exam }}
        run: |
          branch="ai-questions/${EXAM}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add exam/data
          git diff --cached --quiet && { echo "No new questions passed review."; exit 0; }
          git commit -m "MockPariksha: AI questions for ${EXAM} (PYQ relevance ≥ 90, independently reviewed)"
          git push origin "$branch"
          gh pr create --title "AI questions for ${EXAM}" --body "Generated by the grow-bank workflow. Every question was re-solved by an independent reviewer and scored ≥ 90 for PYQ relevance (exam/data/RELEVANCE.md)."
