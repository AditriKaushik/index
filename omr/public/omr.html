<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OMR Sheet &middot; Mahendra's Online OMR</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>

<header class="topbar">
  <div class="wrap row between">
    <div class="brand">
      Mahendra's Online OMR
      <span id="testName">Loading…</span>
    </div>
    <div class="right small" id="who"></div>
  </div>
</header>

<div class="omr-bar" id="omrBar" hidden>
  <div class="wrap">
    <div class="row between">
      <div class="grow">
        <strong id="counter">0</strong> of <span id="total">0</span> filled
        <span class="save-state" id="saveState" role="status" aria-live="polite"></span>
      </div>
      <button type="button" class="btn good" id="submitBtn">Submit Answer Sheet</button>
    </div>
    <div class="progress"><i id="bar"></i></div>
  </div>
</div>

<main>
<div class="wrap stack">
  <div id="msg"></div>

  <div class="note info" id="rules" hidden></div>

  <div id="offline" class="note err" hidden>
    You appear to be offline. Your answers are held on this device and will be
    sent as soon as the connection returns. Do not close this page.
  </div>

  <div class="sheet" id="sheet"></div>

  <div class="card center" id="footBox" hidden>
    <p class="muted small">
      Once submitted, your sheet is locked and evaluated against the official key.
    </p>
    <button type="button" class="btn good" id="submitBtn2">Submit Answer Sheet</button>
  </div>
</div>
</main>

<script type="module" src="/assets/js/omr.js"></script>
</body>
</html>
