org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# Where the app should tell people to go.
#
# The APK serves the app from inside itself, so `location.origin` is an internal
# address that means nothing to anyone else. Share links are therefore built
# from this instead: it must be a public URL where guardian/ is published, and
# it must match the version of the app in the APK.
guardianPublicBase=https://aditrikaushik.github.io/index/guardian/
