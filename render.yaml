# Render Blueprint — deploy with "New +" → "Blueprint" pointing at this repo.
# Provisions a free-tier Postgres and a web service built from the Dockerfile.
# After the first deploy, fill in the auto-generated secrets are fine as-is,
# but set WEBAUTHN_RP_ID/WEBAUTHN_ORIGIN to your real Render URL or custom
# domain once you know it, and OTP_PROVIDER once a real SMS/email provider
# is wired in src/server/auth/otp-delivery.ts.
databases:
  - name: nearby-db
    plan: free
    databaseName: social_platform
    user: app

services:
  - type: web
    name: nearby
    runtime: docker
    plan: free
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nearby-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: WEBAUTHN_RP_ID
        value: localhost
      - key: WEBAUTHN_RP_NAME
        value: Nearby
      - key: WEBAUTHN_ORIGIN
        value: http://localhost:3000
      - key: OTP_PROVIDER
        value: console
